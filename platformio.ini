; PlatformIO project for the MCZ Maestro BLE controller (ESP32)
; Targets:
;   env:esp32dev  -> headless (no display), classic ESP32, display_none.cpp
;   env:esp32c3   -> headless on ESP32-C3 (RISC-V, native USB), display_none.cpp
;   env:cyd       -> Cheap Yellow Display (ESP32-2432S028R), LVGL touch UI, display_cyd.cpp

[env]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; huge_app: 3 MB app, no OTA -> enough space (BLE+WiFi+MQTT+JSON, with display +LVGL)
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE-Arduino@^1.4.1
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DUSE_MQTT=1
    -DMQTT_MAX_PACKET_SIZE=1024

; ---- Headless (no display) -------------------------------------------------
[env:esp32dev]
; inherits everything from [env]; USE_DISPLAY not set -> display_none.cpp active

; ---- Headless on ESP32-C3 (RISC-V, native USB-CDC) --------------------------
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; inherits [env] lib_deps; no USE_DISPLAY -> display_none.cpp active

; ---- Cheap Yellow Display (ESP32-2432S028R): ILI9341 320x240 + XPT2046 (resistive) ----
[env:cyd]
lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI@^2.5
    lvgl/lvgl@^8.4
    paulstoffregen/XPT2046_Touchscreen
build_flags =
    ${env.build_flags}
    -DUSE_DISPLAY=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    ; --- TFT_eSPI User_Setup for CYD (ILI9341, HSPI) ---
    -DUSER_SETUP_LOADED
    -DILI9341_2_DRIVER
    -DTFT_RGB_ORDER=TFT_RGB          ; CYD panel is RGB, not BGR (otherwise R<->B swapped)
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_GFXFF
    -DSMOOTH_FONT
